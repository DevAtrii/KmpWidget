#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# KMP — spm4Kmp cinterop (warp-ui WidgetKit bridge)
kotlin.mpp.enableCInteropCommonization=true
# Bridge folder is empty; Swift lives in repo-root warpWidgetKit SPM package
spmforkmp.disableStartupFile=true
# Xcode already depends on local ../warpWidgetKit — hide includeProduct nag
spmforkmp.hideLocalPackageMessage=true